name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n scripts/ia
          for file in scripts/*.sh; do
            bash -n "$file"
          done

      - name: Validate JSON
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          for path in Path("config").rglob("*.json"):
              with path.open(encoding="utf-8") as f:
                  json.load(f)
              print(f"OK {path}")
          PY

      - name: Validate referenced prompts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("config/models.json").read_text())
          for name, profile in data["profiles"].items():
              prompt = Path(profile["prompt"])
              if not prompt.exists():
                  raise SystemExit(f"{name}: prompt ausente: {prompt}")
              print(f"OK {name}: {prompt}")
          PY

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          sed -i 's/^WEBUI_SECRET_KEY=.*/WEBUI_SECRET_KEY=ci-placeholder-secret/' .env
          docker compose config >/dev/null
